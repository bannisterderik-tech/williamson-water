<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proposals | Pure Tap Water Co.</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#081d4d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/app.css">
</head>
<body>
<!-- config.js is gitignored and only exists once Supabase is wired. Absent = demo mode. -->
<script src="../js/config.js"></script>
<script src="../js/app-data.js"></script>
<script src="../js/app-ui.js"></script>
<script src="../js/app-link.js"></script>
<script src="../js/app-shell.js"></script>
<script>
WW.ready.then(function () {
  var ses = WWShell.mount({
    page: "proposals",
    title: "Proposals",
    sub: "What you quoted, and whether it landed.",
    actions: "<button class='btn btn-primary btn-sm' id='new-prop'>+ Proposal</button>"
  });
  if (!ses) return;
  var $page = WWShell.page();

  var STATUS = [
    { key: "draft",    label: "Draft",    badge: "gray" },
    { key: "sent",     label: "Sent",     badge: "blue" },
    { key: "accepted", label: "Accepted", badge: "green" },
    { key: "paid",     label: "Paid",     badge: "green" },
    { key: "declined", label: "Declined", badge: "red" }
  ];
  function badgeFor(k) {
    var s = STATUS.filter(function (x) { return x.key === k; })[0];
    return s ? "<span class='badge " + s.badge + "'>" + s.label + "</span>" : "<span class='badge gray'>" + WWUI.esc(k || "—") + "</span>";
  }

  $page.innerHTML =
    "<div class='stat-row' id='stats'></div>" +
    "<div id='bar'></div>" +
    "<div class='panel'><div class='panel-body flush tbl-scroll'>" +
      "<table class='tbl'><thead><tr><th>Proposal</th><th>Customer</th><th>Created</th>" +
      "<th>Based on</th><th class='num'>Amount</th><th>Status</th></tr></thead><tbody id='rows'></tbody></table>" +
    "</div></div>";

  var bar = WWUI.listBar(document.getElementById("bar"), {
    placeholder: "Search title, customer…",
    sorts: [
      { value: "recent", label: "Newest first" },
      { value: "amount", label: "Largest first" },
      { value: "status", label: "By status" }
    ],
    onChange: render
  });

  function render() {
    var all = WW.list("proposals").map(function (p) {
      var c = Object.create(p); c._cust = WW.customerName(p.customer_id); return c;
    });

    var open = all.filter(function (p) { return p.status === "draft" || p.status === "sent"; });
    var won  = all.filter(function (p) { return p.status === "accepted" || p.status === "paid"; });
    var decided = won.length + all.filter(function (p) { return p.status === "declined"; }).length;

    document.getElementById("stats").innerHTML =
      "<div class='stat'><div class='stat-label'>Open</div><div class='stat-num'>" + open.length + "</div><div class='stat-sub'>" + WW.money(open.reduce(function (a, p) { return a + Number(p.amount || 0); }, 0)) + " in play</div></div>" +
      "<div class='stat'><div class='stat-label'>Won</div><div class='stat-num'>" + won.length + "</div><div class='stat-sub'>" + WW.money(won.reduce(function (a, p) { return a + Number(p.amount || 0); }, 0)) + "</div></div>" +
      "<div class='stat'><div class='stat-label'>Close rate</div><div class='stat-num'>" + (decided ? Math.round(won.length / decided * 100) : 0) + "%</div><div class='stat-sub'>of decided proposals</div></div>" +
      "<div class='stat'><div class='stat-label'>Average</div><div class='stat-num'>" + WW.money(all.length ? all.reduce(function (a, p) { return a + Number(p.amount || 0); }, 0) / all.length : 0) + "</div><div class='stat-sub'>per proposal</div></div>";

    var rows = WWUI.filterSort(all, bar, {
      keys: ["title", "_cust"],
      sorts: {
        recent: WWUI.cmp.dateDesc("created"),
        amount: WWUI.cmp.numDesc("amount"),
        status: WWUI.cmp.textAsc("status")
      }
    });

    WWUI.table(document.getElementById("rows"), rows, [
      { cell: function (p) { return "<span class='t-strong'>" + WWUI.esc(p.title) + "</span>"; } },
      { cell: function (p) { return WWUI.esc(p._cust); } },
      { cell: function (p) { return WW.fmtDate(p.created); } },
      { cell: function (p) { return p.test_id ? "<span class='badge blue'>Water test</span>" : "<span class='t-sub'>—</span>"; } },
      { cls: "num", cell: function (p) { return WW.money(p.amount); } },
      { cell: function (p) { return badgeFor(p.status); } }
    ], { empty: "No proposals yet.", onRow: openProp });
  }

  function openProp(p) {
    var test = p.test_id ? WW.get("water_tests", p.test_id) : null;
    WWUI.open({
      eyebrow: "Proposal",
      title: p.title,
      subtitle: WW.customerName(p.customer_id) + " · " + WW.money(p.amount),
      bodyHTML:
        WWUI.section("Details", WWUI.kv([
          ["Customer", WWLink.name("customer", p.customer_id, WW.customerName(p.customer_id)), "raw"],
          ["Amount", WW.money(p.amount)],
          ["Created", WW.fmtDate(p.created)],
          ["Status", (STATUS.filter(function (s) { return s.key === p.status; })[0] || {}).label || p.status]
        ])) +
        /* The scope frozen onto the proposal when it was built. Deliberately
           NOT recomputed from the linked test: editing a reading later must not
           silently rewrite what the customer was quoted. */
        (p.scope
          ? WWUI.section("Scope as quoted", "<p style='margin:0;white-space:pre-wrap'>" + WWUI.esc(p.scope) + "</p>")
          : "") +
        (test
          ? WWUI.section("Backed by this water test", WWUI.testGrid(test)) +
            WWUI.section("What the numbers support",
              WWUI.list(WW.recommend(test).map(function (r) { return { main: r.service, sub: r.why }; }), "Nothing over standard."))
          : WWUI.section("Backing data",
              "<div class='callout warn'>No water test linked. A recommendation without a measurement is a guess — " +
              "log a test before this goes out.</div>")),
      actions: STATUS.filter(function (s) { return s.key !== p.status; }).slice(0, 3).map(function (s) {
        return { label: "Mark " + s.label.toLowerCase(), kind: s.key === "accepted" ? "primary" : "outline",
                 onClick: function () { WW.update("proposals", p.id, { status: s.key }); WWUI.close(); render(); WWUI.toast("Marked " + s.label.toLowerCase()); } };
      }).concat(
        /* An accepted proposal has exactly one sensible next step. */
        (p.status === "accepted" || p.status === "sent")
          ? [{ label: "Invoice this", kind: "primary", onClick: function () {
                location.href = "invoices.html?proposal=" + encodeURIComponent(p.id);
            } }]
          : [],
        test ? [{ label: "Open the water test", onClick: function () {
                location.href = "tests.html?open=" + encodeURIComponent(test.id);
            } }] : [],
        [{ label: "Delete", kind: "danger", onClick: function () {
            WWUI.confirmDelete("this proposal", function () { WW.remove("proposals", p.id); WWUI.close(); render(); WWUI.toast("Deleted"); });
        } }]
      )
    });
  }

  /* pre: {customer_id, test_id} carried in from a water test or a customer
     record. Title and scope are DERIVED from the test's recommendations, never
     invented, and the amount is always left blank — no price in this codebase
     is ours to guess. */
  function openPropForm(pre) {
    pre = pre || {};
    var test = pre.test_id ? WW.get("water_tests", pre.test_id) : null;
    var recs = test ? (WW.recommend(test) || []) : [];

    var cust  = WWLink.options(WW.list("customers"), pre.customer_id, function (c) { return c.name; });
    var tests = WWLink.options(WW.list("water_tests"), pre.test_id, function (t) {
      var o = WWLink.testOwner(t);
      return WW.fmtDate(t.date) + " — " + ((o && o.name) || "—");
    });

    var banner = "";
    if (test) {
      var owner = WWLink.testOwner(test);
      banner = WWLink.ctx({
        eyebrow: "Built from a water test",
        title: (owner && owner.name) || "—",
        sub: "Tested " + WW.fmtDate(test.date) + " · " +
             (recs.length ? recs.length + " recommendation" + (recs.length > 1 ? "s" : "") + " carried into the scope"
                          : "nothing measured over its screening level"),
        lines: [
          ["Supply", test.source_type === "well" ? "Private well" : "Municipal"],
          ["Hardness", test.hardness_gpg != null && test.hardness_gpg !== "" ? test.hardness_gpg + " gpg" : "—"],
          ["Tested by", test.tech || "—"]
        ]
      }) + "<div style='height:.9rem'></div>";
    }

    WWUI.modal({
      title: test ? "Proposal from the water test" : "New proposal", wide: true,
      bodyHTML: banner +
        "<div><label>Title</label><input name='title' value='" + WWUI.esc(test ? WWLink.titleFromTest(test) : "") + "' placeholder='Whole-house carbon + softener'></div>" +
        "<div class='form-row' style='margin-top:.85rem'>" +
          "<div><label>Customer</label><select name='customer_id'>" + cust + "</select></div>" +
          "<div><label>Amount</label><input name='amount' type='number' step='any' placeholder='you set this'></div>" +
        "</div>" +
        "<div style='margin-top:.85rem'><label>Backed by water test</label><select name='test_id'>" +
          "<option value=''" + (pre.test_id ? "" : " selected") + ">— none —</option>" + tests + "</select></div>" +
        "<div style='margin-top:.85rem'><label>Scope</label>" +
          "<textarea name='scope' rows='" + (recs.length ? Math.min(3 + recs.length * 2, 12) : 4) + "' " +
          "placeholder='What this proposal covers'>" + WWUI.esc(test ? WWLink.scopeFromTest(test) : "") + "</textarea></div>" +
        "<p class='t-sub'>Link a test wherever one exists. Every performance claim needs substantiation independent " +
        "of the testimonial carrying it (16 CFR 255.2(a)) — a measured result is that substantiation.</p>",
      okLabel: "Create",
      onOk: function (f) {
        if (!f.title) { WWUI.toast("Title is required", "err"); return false; }
        if (!f.customer_id) { WWUI.toast("Pick a customer", "err"); return false; }
        f.status = "draft"; f.created = WW.today();
        var p = WW.add("proposals", f);
        render();
        WWLink.clear();
        WWUI.toast("Proposal created");
        return true;
      }
    });
  }

  document.getElementById("new-prop").addEventListener("click", function () { openPropForm(); });

  /* Deep links.
       ?test=<id>      -> build a proposal from that test
       ?customer=<id>  -> build a proposal for that customer
       ?open=<id>      -> open an existing proposal

     A test taken against a LEAD cannot become a proposal directly: proposals
     are filed against a customer by foreign key. Rather than fail, convert. */
  function deepLink() {
    var testId = WWLink.q("test"), custId = WWLink.q("customer"), openId = WWLink.q("open");

    if (openId) {
      var p = WW.get("proposals", openId);
      if (p) openProp(p); else WWUI.toast("That proposal no longer exists", "err");
      WWLink.clear();
      return;
    }

    if (custId && !testId) {
      if (!WW.get("customers", custId)) { WWUI.toast("That customer no longer exists", "err"); WWLink.clear(); return; }
      openPropForm({ customer_id: custId });
      return;
    }

    if (!testId) return;

    var t = WW.get("water_tests", testId);
    if (!t) { WWUI.toast("That water test no longer exists", "err"); WWLink.clear(); return; }

    if (t.customer_id) { openPropForm({ test_id: testId, customer_id: t.customer_id }); return; }

    /* lead-owned test */
    var lead = t.lead_id ? WW.get("leads", t.lead_id) : null;
    if (!lead) {
      WWUI.toast("That test has no customer or lead attached", "err");
      WWLink.clear();
      return;
    }
    var already = WW.leadCustomer(lead.id);
    if (already) { openPropForm({ test_id: testId, customer_id: already.id }); return; }

    WWUI.modal({
      title: "Convert the lead first",
      bodyHTML:
        WWLink.ctx({
          eyebrow: "This test belongs to a lead",
          title: lead.name,
          sub: "A proposal is filed against a customer, so the lead has to become one.",
          lines: [["Phone", lead.phone || "—"], ["Email", lead.email || "—"], ["Town", lead.city || "—"]]
        }) +
        "<p style='margin:.9rem 0 0'>Converting copies these details onto a new customer, moves this water test " +
        "across with it, and marks the lead <b>Won</b>. Then the proposal opens pre-filled.</p>",
      okLabel: "Convert and continue",
      cancelLabel: "Cancel",
      onOk: function () {
        WW.convertLead(lead.id).then(function (r) {
          WWUI.toast("Converted — " + r.customer.name + " is now a customer");
          render();
          openPropForm({ test_id: testId, customer_id: r.customer.id });
        }).catch(function (e) {
          WWUI.toast((e && e.message) || "Could not convert the lead", "err");
        });
        return true;
      }
    });
  }

  render();
  deepLink();

});
</script>
</body>
</html>
