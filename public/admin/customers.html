<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customers | Pure Tap Water Co.</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#081d4d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/app.css">
</head>
<body>
<!-- config.js is gitignored and only exists once Supabase is wired. Absent = demo mode. -->
<script src="../js/config.js"></script>
<script src="../js/app-data.js"></script>
<script src="../js/app-ui.js"></script>
<script src="../js/app-link.js"></script>
<script src="../js/app-shell.js"></script>
<script>
WW.ready.then(function () {
  var ses = WWShell.mount({
    page: "customers",
    title: "Customers",
    sub: "Every account, its water source, and what is installed.",
    actions: "<button class='btn btn-primary btn-sm' id='new-cust'>+ Customer</button>"
  });
  if (!ses) return;
  var $page = WWShell.page();

  $page.innerHTML =
    "<div id='bar'></div>" +
    "<div class='panel'><div class='panel-body flush tbl-scroll'>" +
      "<table class='tbl'><thead><tr><th>Name</th><th>Town</th><th>Source</th><th>Plan</th>" +
      "<th>Equipment</th><th>Last test</th></tr></thead><tbody id='rows'></tbody></table>" +
    "</div></div>";

  var bar = WWUI.listBar(document.getElementById("bar"), {
    placeholder: "Search name, town, address, phone…",
    sorts: [
      { value: "name",  label: "Name A–Z" },
      { value: "town",  label: "Town A–Z" },
      { value: "plan",  label: "Plan members first" }
    ],
    onChange: render
  });

  function render() {
    var rows = WWUI.filterSort(WW.list("customers"), bar, {
      keys: ["name", "city", "address", "phone", "email", "notes"],
      sorts: {
        name: WWUI.cmp.textAsc("name"),
        town: WWUI.cmp.textAsc("city"),
        plan: function (a, b) { return (b.plan ? 1 : 0) - (a.plan ? 1 : 0); }
      }
    });

    WWUI.table(document.getElementById("rows"), rows, [
      { cell: function (c) { return "<span class='t-strong'>" + WWUI.esc(c.name) + "</span><span class='t-sub'>" + WWUI.esc(c.phone || "") + "</span>"; } },
      { cell: function (c) { return WWUI.esc(c.city || "—"); } },
      { cell: function (c) {
          return c.source_type === "well"
            ? "<span class='badge amber'>Well" + (c.well_depth_ft ? " · " + c.well_depth_ft + " ft" : "") + "</span>"
            : "<span class='badge blue'>Municipal</span>"; } },
      { cell: function (c) { return c.plan ? "<span class='badge green'>" + WWUI.esc(c.plan) + "</span>" : "<span class='t-sub'>—</span>"; } },
      { cell: function (c) { return String(WW.list("equipment").filter(function (e) { return e.customer_id === c.id; }).length); } },
      { cell: function (c) { var t = WW.latestTest({ customerId: c.id }); return t ? WW.fmtDate(t.date) : "<span class='t-sub'>never</span>"; } }
    ], { empty: "No customers yet.", onRow: function (c) { WWLink.go("customer", c.id); } });
  }

  function custForm(c) {
    c = c || {};
    return "<div class='form-row'>" +
        "<div><label>Name</label><input name='name' value='" + WWUI.esc(c.name || "") + "'></div>" +
        "<div><label>Phone</label><input name='phone' value='" + WWUI.esc(c.phone || "") + "'></div>" +
      "</div><div class='form-row'>" +
        "<div><label>Email</label><input name='email' type='email' value='" + WWUI.esc(c.email || "") + "'></div>" +
        "<div><label>Address</label><input name='address' value='" + WWUI.esc(c.address || "") + "'></div>" +
      "</div><div class='form-row'>" +
        "<div><label>Town</label><input name='city' value='" + WWUI.esc(c.city || "") + "'></div>" +
        "<div><label>Water source</label><select name='source_type'>" +
          "<option value='municipal'" + (c.source_type === "municipal" ? " selected" : "") + ">Municipal</option>" +
          "<option value='well'" + (c.source_type === "well" ? " selected" : "") + ">Private well</option></select></div>" +
        "<div><label>Well depth (ft)</label><input name='well_depth_ft' type='number' value='" + WWUI.esc(c.well_depth_ft || "") + "'></div>" +
      "</div>" +
      "<div><label>Notes</label><textarea name='notes'>" + WWUI.esc(c.notes || "") + "</textarea></div>";
  }

  function editCust(c) {
    WWUI.modal({ title: "Edit customer", wide: true, bodyHTML: custForm(c), okLabel: "Save",
      onOk: function (f) { WW.update("customers", c.id, f); WWUI.close(); render(); WWUI.toast("Saved"); } });
  }

  document.getElementById("new-cust").addEventListener("click", function () {
    WWUI.modal({ title: "New customer", wide: true, bodyHTML: custForm(), okLabel: "Add customer",
      onOk: function (f) {
        if (!f.name) { WWUI.toast("Name is required", "err"); return false; }
        WW.add("customers", f); render(); WWUI.toast("Customer added");
      } });
  });

  render();

  /* ?edit=<id> — the record page sends editing back here, where the form lives. */
  (function () {
    var ed = WWLink.q("edit");
    if (!ed) return;
    var c = WW.get("customers", ed);
    WWLink.clear();
    if (c) editCust(c); else WWUI.toast("That customer no longer exists", "err");
  })();

});
</script>
</body>
</html>
