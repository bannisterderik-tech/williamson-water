<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Water Tests | Pure Tap Water Co.</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#081d4d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/app.css">
</head>
<body>
<!-- config.js is gitignored and only exists once Supabase is wired. Absent = demo mode. -->
<script src="../js/config.js"></script>
<script src="../js/app-data.js"></script>
<script src="../js/app-ui.js"></script>
<script src="../js/app-link.js"></script>
<script src="../js/app-shell.js"></script>
<script>
WW.ready.then(function () {
  var ses = WWShell.mount({
    page: "tests",
    title: "Water Tests",
    sub: "Every reading is rated against a real regulatory threshold — never a guess.",
    actions: "<button class='btn btn-primary btn-sm' id='new-test'>+ Log a test</button>"
  });
  if (!ses) return;
  var $page = WWShell.page();

  $page.innerHTML =
    "<div class='callout'><strong>This is the asset.</strong> Field tests are the only way to get hardness numbers " +
    "for the towns whose utilities never publish them — Cedaredge, Paonia, Hotchkiss, Crawford, Ridgway, Ouray, " +
    "Telluride, Mountain Village, Norwood, Nucla and Naturita all report no hardness, TDS or pH in their CCRs. " +
    "Enough tests in one town and we can publish a sourced local average that no competitor can match.</div>" +
    "<div id='bar' style='margin-top:1.1rem'></div>" +
    "<div class='panel'><div class='panel-body flush tbl-scroll'>" +
      "<table class='tbl'><thead><tr><th>Date</th><th>Who</th><th>Source</th><th>Hardness</th>" +
      "<th>Flags</th><th>Tech</th></tr></thead><tbody id='rows'></tbody></table>" +
    "</div></div>";

  var bar = WWUI.listBar(document.getElementById("bar"), {
    placeholder: "Search customer, tech, notes…",
    sorts: [
      { value: "newest", label: "Newest first" },
      { value: "oldest", label: "Oldest first" },
      { value: "hard",   label: "Hardest water first" }
    ],
    onChange: render
  });

  function who(t) {
    if (t.customer_id) return WW.customerName(t.customer_id);
    var l = WW.get("leads", t.lead_id);
    return l ? l.name + " (lead)" : "—";
  }

  function render() {
    var rows = WW.list("water_tests").map(function (t) {
      var c = Object.create(t); c._who = who(t); return c;
    });
    rows = WWUI.filterSort(rows, bar, {
      keys: ["_who", "tech", "notes", "source_type"],
      sorts: {
        newest: WWUI.cmp.dateDesc("date"),
        oldest: WWUI.cmp.dateAsc("date"),
        hard:   WWUI.cmp.numDesc("hardness_gpg")
      }
    });

    WWUI.table(document.getElementById("rows"), rows, [
      { cell: function (t) { return "<span class='t-strong'>" + WW.fmtDate(t.date) + "</span>"; } },
      { cell: function (t) { return WWUI.esc(t._who); } },
      { cell: function (t) { return "<span class='badge " + (t.source_type === "well" ? "amber" : "blue") + "'>" + WWUI.esc(t.source_type || "—") + "</span>"; } },
      { cell: function (t) {
          if (t.hardness_gpg == null || t.hardness_gpg === "") return "—";
          var r = WW.rate("hardness_gpg", t.hardness_gpg);
          return "<span class='badge " + r + "'>" + t.hardness_gpg + " gpg</span>"; } },
      { cell: function (t) {
          var over = WW.ANALYTES.filter(function (a) { return WW.rate(a.key, t[a.key]) === "over"; });
          if (t.bacteria === "positive") over.push({ label: "Bacteria" });
          if (t.h2s === "yes") over.push({ label: "Sulfur" });
          if (!over.length) return "<span class='badge ok'>Clear</span>";
          return over.slice(0, 3).map(function (a) { return "<span class='badge over'>" + WWUI.esc(a.label) + "</span>"; }).join(" ") +
                 (over.length > 3 ? " <span class='badge gray'>+" + (over.length - 3) + "</span>" : ""); } },
      { cell: function (t) { return WWUI.esc(t.tech || "—"); } }
    ], { empty: "No water tests logged yet.", onRow: openTest });
  }

  function openTest(t) {
    var recs = WW.recommend(t);
    WWUI.open({
      eyebrow: "Water test · " + WW.fmtDate(t.date),
      title: who(t),
      subtitle: (t.source_type === "well" ? "Private well" : "Municipal") + (t.tech ? " · " + t.tech : ""),
      bodyHTML:
        WWUI.section("On file for", WWUI.kv([
          ["Record", WWLink.ownerLink(t), "raw"],
          ["Tested", WW.fmtDate(t.date)],
          ["Supply", t.source_type === "well" ? "Private well" : "Municipal"]
        ])) +
        WWUI.section("Results", WWUI.testGrid(t)) +
        WWUI.section("What these numbers support",
          WWUI.list(recs.map(function (r) { return { main: r.service, sub: r.why }; }),
                    "Nothing measured above its screening level.")) +
        (t.notes ? WWUI.section("Field notes", "<p style='margin:0'>" + WWUI.esc(t.notes) + "</p>") : "") +
        WWUI.section("Reference",
          "<p class='t-sub' style='margin:0'>Thresholds come from EPA primary/secondary standards and the verified " +
          "regional dataset in <code>data/verified-facts.json</code> (359 sourced facts). Hover any result for its basis.</p>"),
      actions: [
        { label: "Build a proposal", kind: "primary", onClick: function () { location.href = "proposals.html?test=" + encodeURIComponent(t.id); } },
        { label: "Delete", kind: "danger", onClick: function () {
            WWUI.confirmDelete("this test", function () { WW.remove("water_tests", t.id); WWUI.close(); render(); WWUI.toast("Test deleted"); });
        } }
      ]
    });
  }

  /* pre: {customer_id, lead_id, source_type} carried in from a record page via
     the query string. The selects honour it instead of making the tech re-pick
     the customer the app already knows about. */
  function testForm(pre) {
    pre = pre || {};
    var custOpts = WWLink.options(WW.list("customers"), pre.customer_id, function (c) { return c.name; });
    var leadOpts = WWLink.options(WW.list("leads"), pre.lead_id, function (l) { return l.name + " (lead)"; });
    var fields = WW.ANALYTES.map(function (a) {
      return "<div><label>" + WWUI.esc(a.label) + (a.unit ? " <span class='t-sub'>(" + WWUI.esc(a.unit) + ")</span>" : "") + "</label>" +
             "<input name='" + a.key + "' type='number' step='any' placeholder='—'></div>";
    }).join("");
    return "<div class='form-row'>" +
        "<div><label>Customer</label><select name='customer_id'><option value=''" + (pre.customer_id ? "" : " selected") + ">—</option>" + custOpts + "</select></div>" +
        "<div><label>…or lead</label><select name='lead_id'><option value=''" + (pre.lead_id ? "" : " selected") + ">—</option>" + leadOpts + "</select></div>" +
      "</div><div class='form-row'>" +
        "<div><label>Date</label><input name='date' type='date' value='" + WW.today() + "'></div>" +
        "<div><label>Source</label><select name='source_type'>" +
          WWLink.pick([["well", "Private well"], ["municipal", "Municipal"]], pre.source_type || "well") + "</select></div>" +
        "<div><label>Disinfectant</label><select name='disinfectant'><option value=''>—</option><option value='chloramine'>Chloramine</option><option value='free chlorine'>Free chlorine</option></select></div>" +
      "</div>" +
      "<h4 style='margin:1.1rem 0 .5rem;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)'>Readings</h4>" +
      "<div class='form-row'>" + fields + "</div>" +
      "<div class='form-row'>" +
        "<div><label>Sulfur odor</label><select name='h2s'><option value='no'>No</option><option value='yes'>Yes</option></select></div>" +
        "<div><label>Bacteria</label><select name='bacteria'><option value='negative'>Negative</option><option value='positive'>Positive</option></select></div>" +
        "<div><label>Turbidity</label><select name='turbidity'><option value='no'>No</option><option value='yes'>Yes</option></select></div>" +
        "<div><label>Tech</label><input name='tech' value='" + WWUI.esc(ses.name || "") + "'></div>" +
      "</div>" +
      "<div><label>Field notes</label><textarea name='notes'></textarea></div>";
  }

  /* One opener for both the toolbar button and the ?lead=/?customer= deep link,
     so a pre-filled test cannot drift from a hand-started one. */
  function openTestForm(pre) {
    pre = pre || {};
    var owner = pre.lead_id ? WW.get("leads", pre.lead_id)
              : pre.customer_id ? WW.get("customers", pre.customer_id) : null;
    var banner = "";
    if (owner) {
      banner = WWLink.ctx({
        eyebrow: pre.lead_id ? "Logging against this lead" : "Logging against this customer",
        title: owner.name,
        sub: "Pre-selected below — change it if this test is for someone else.",
        lines: [
          ["Town", owner.city || "—"],
          ["Phone", owner.phone || "—"],
          pre.lead_id ? ["Interested in", owner.service || "—"]
                      : ["Supply", owner.source_type === "well" ? "Private well"
                               : owner.source_type === "municipal" ? "Municipal" : "unknown"]
        ]
      }) + "<div style='height:.9rem'></div>";
    }
    WWUI.modal({
      title: "Log a water test", wide: true,
      bodyHTML: banner + testForm(pre),
      okLabel: "Save test",
      onOk: function (f) {
        if (!f.customer_id && !f.lead_id) { WWUI.toast("Pick a customer or a lead", "err"); return false; }
        if (f.customer_id && f.lead_id) { WWUI.toast("Pick a customer or a lead, not both", "err"); return false; }
        WW.ANALYTES.forEach(function (a) { if (f[a.key] === "") f[a.key] = null; });
        var t = WW.add("water_tests", f);

        /* A logged test moves the lead down the pipeline — the whole point of
           the stage list is that it reflects reality without being re-keyed. */
        if (f.lead_id) {
          var l = WW.get("leads", f.lead_id);
          var order = WW.LEAD_STAGES.map(function (x) { return x.key; });
          if (l && order.indexOf(l.stage || "new") < order.indexOf("tested")) {
            WW.update("leads", f.lead_id, { stage: "tested" });
          }
        }
        render();
        WWLink.clear();
        offerProposal(t);
      }
    });
  }

  /* The readings are in — the next step is always the proposal, so say so here
     rather than making someone navigate back out and find the test again. */
  function offerProposal(t) {
    var recs = WW.recommend(t) || [];
    var canSell = ses.role === "admin" || ses.role === "sales";
    if (!recs.length || !canSell) { WWUI.toast("Test saved"); return; }
    WWUI.modal({
      title: "Test saved",
      bodyHTML:
        "<p style='margin:0 0 .85rem'>These readings support " +
          "<b>" + recs.length + " recommendation" + (recs.length > 1 ? "s" : "") + "</b>:</p>" +
        WWUI.list(recs.map(function (r) { return { main: r.service, sub: r.why }; })) +
        "<p class='t-sub' style='margin:.85rem 0 0'>Building the proposal now carries the customer and these " +
        "recommendations across. You still set the price.</p>",
      okLabel: "Build the proposal",
      cancelLabel: "Not now",
      onOk: function () {
        location.href = "proposals.html?test=" + encodeURIComponent(t.id);
        return true;
      }
    });
  }

  document.getElementById("new-test").addEventListener("click", function () { openTestForm(); });

  render();

  /* Deep links.
       ?lead=<id> / ?customer=<id>  -> open the form with that owner preselected
       ?open=<testId>               -> open that test's detail (from a record page) */
  (function deepLink() {
    var leadId = WWLink.q("lead"), custId = WWLink.q("customer"), openId = WWLink.q("open");

    if (openId) {
      var t = WW.get("water_tests", openId);
      if (t) { openTest(t); } else { WWUI.toast("That test no longer exists", "err"); }
      WWLink.clear();
      return;
    }
    if (!leadId && !custId) return;

    if (leadId && !WW.get("leads", leadId)) { WWUI.toast("That lead no longer exists", "err"); WWLink.clear(); return; }
    if (custId && !WW.get("customers", custId)) { WWUI.toast("That customer no longer exists", "err"); WWLink.clear(); return; }

    var cust = custId ? WW.get("customers", custId) : null;
    openTestForm({
      lead_id: leadId || "",
      customer_id: custId || "",
      source_type: cust && cust.source_type ? cust.source_type : "well"
    });
  })();

});
</script>
</body>
</html>
